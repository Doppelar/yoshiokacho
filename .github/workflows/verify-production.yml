name: Verify production

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full production commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-production
  cancel-in-progress: false

jobs:
  verify-live-web:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Verify live project, SHA and links
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: node .github/scripts/verify-production.js
      - name: Report failure
        if: failure()
        run: |
          echo '### Production verification failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The expected web project, commit or links are not served at https://web-olive-ten-47.vercel.app/.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Further automatic merges are blocked until this commit passes verification. No DB or Vercel settings were changed.' >> "$GITHUB_STEP_SUMMARY"
