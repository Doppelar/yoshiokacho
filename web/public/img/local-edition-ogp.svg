<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">みらい議会 地方版</title>
  <desc id="description">全国の市町村のみらい議会。日本地図から、あなたのまちへ。</desc>
  <!-- Colors follow the existing Mirai tokens in web/src/app/globals.css. -->
  <style>
    :root {
      --color-mirai-surface: #f7f4f0;
      --color-mirai-text: #1f2937;
      --color-mirai-text-secondary: #404040;
      --color-mirai-gradient-start: #7fe8a8;
    }
    .surface { fill: var(--color-mirai-surface); }
    .accent { fill: var(--color-mirai-gradient-start); }
    text { font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif; text-anchor: middle; }
    .heading { fill: var(--color-mirai-text); font-size: 76px; font-weight: 700; }
    .subtitle { fill: var(--color-mirai-text-secondary); font-size: 32px; }
    .caption { fill: var(--color-mirai-text-secondary); font-size: 26px; }
  </style>
  <rect class="surface" width="1200" height="630" />
  <rect class="accent" width="1200" height="12" />
  <image href="data:image/png;base64," x="516" y="72" width="168" height="143" />
  <text class="heading" x="600" y="338">みらい議会 地方版</text>
  <text class="subtitle" x="600" y="430">日本地図から、あなたのまちへ。</text>
  <text class="caption" x="600" y="528">全国の市町村のみらい議会</text>
</svg>
